# Каждые 10 минут запускает рассылку напоминаний (/api/cron/notifications).
# Секреты не нужны: workflow подтверждает себя OIDC-токеном GitHub,
# а сервер принимает токены только из этого репозитория.
# Если сервер не ответил, запуск падает — GitHub пришлёт письмо владельцу репозитория.
name: scheduler
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_URL: ${{ vars.API_URL || 'https://planner-backend-three.vercel.app' }}
    steps:
      - name: Run notifications tick
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=planner-backend" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          code=$(curl -s -o body.txt -w "%{http_code}" --max-time 60 -X POST \
            -H "Authorization: Bearer $TOKEN" "$API_URL/api/cron/notifications" || echo 000)
          echo "HTTP $code"; head -c 300 body.txt || true; echo
          test "$code" = "200"
